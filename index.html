<!DOCTYPE html>
< lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark coffee shop メニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-500">

    <header class="bg-gray-300 shadow px-6 py-4">
        <h1 class="text-3x1 font-bold text-yellow-600">Dark coffee shop</h1>
        <p class="text-gray-600 text-sm mt-1">東京・丸の内の夜の大人コーヒーショップ</p>
    </header>
    <main class="max-w-2x1 mx-auto px-4 py-8">
    <section class="mb-8">
        <h2 class="text-x1 font-bold text-yellow-600 mb-4 text-center">ドリンク</h2>
        <div class="bg-gray-200 rounded-full shadow p-6 mb-4 text-center">
            <h3 class="text-1g font-bold textt-gray-900">ブラックコーヒー</h3>
            <p class="text-gray-600 mt-1">当店の人気メニュー。深みとコクがある。</p>
            <p class="text-blue-600 font-bold mt-2">560円</p>
        </div>

        <div class="bg-gray-200 rounded-full shadow p-6 mb-4 text-center">
            <h3 class="text-1g font-bold text-gray-900">カフェラテ</h3>
            <p class="text-gray-600 mt-1">濃厚なミルクと香ばしいエスプレッソの香り</p>
            <p class="text-blue-600 font-bold mt-2">650円</p>
        </div>
    </section>

    <section class="mb-8">
        <h2 class="text-x1 font-bold text-yellow-600 mb-4 text-center">スイーツ</h2>
        <div class="bg-gray-200 rounded-full shadow p-6 mb-4 text-center">
            <h4 class="text-1g font-bold text-gray-900">ティラミス</h4>
            <p class="textt-gray-600 mt-1">自家製マスカルポーネ使用</p>
            <p class="text-blue-600 font-bold mt-2">700円</p>
        </div>
    </section>
    </main>

    <footer class="bg-gray-300 text-center py-6 text-gray-500 text-sm">
        <p>営業時間 12:00-23:00 / 定休日:水曜日</p>
    </footer>
</body>
</html>
